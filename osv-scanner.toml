# osv-scanner triage policy (P20-012 gate) — committed at the repository root
# so the CI scan job and local runs share one accepted-risk ledger.
#
# Rules for this file:
#   - Only findings whose fix requires a MAJOR framework migration (no stable
#     in-line patch exists) may be ignored, and each entry must state (a) why
#     the vulnerable path is not reachable in this deployment or how it is
#     neutralized at the application boundary, and (b) the real fix path.
#   - Re-evaluate every entry on each dependency refresh; drop entries the
#     moment the underlying upgrade lands.
#
# ── Ledger status: 1 entry (as of 2026-10-03, PR #56 semgrep/scan refresh) ──
# Established 2026-09-10 (R8) with four entries covering the next-auth v4 line
# (GHSA-7rqj-j65f-68wh CRITICAL, GHSA-xmf8-cvqr-rfgj HIGH, GHSA-x445-f3h2-j279
# MODERATE, GHSA-w5hq-g745-h8pq MODERATE via uuid@8.3.2). The original triage
# assumed the fix required the API-breaking v4→v5 migration. That premise became
# false when upstream shipped the v4 patch line: next-auth 4.24.15
# (2026-07-20) fixes the advisories AND moves the uuid dependency to ^11.1.1.
# R12 upgraded next-auth 4.24.13 → 4.24.15; osv-scanner v2.5.1 now reports
# "No issues found" with all four ignores explicitly UNUSED — so the entries
# were dropped per this file's own rules rather than carried forward.
#
# Add new [[IgnoredVulns]] entries below ONLY per the rules above.

# GHSA-vfj7-8cjw-p6xm (HIGH, CVSS 8.7) — braces@3.0.3, no fixed version
# exists upstream ("0 vulnerabilities can be fixed"). Surfaced 2026-10-03:
# the scan job's semgrep upgrade run made the whole scan job complete for
# the first time in weeks, and osv-scanner v2.5.1's advisory DB now carries
# this NEW entry affecting even the latest braces release.
# (a) Not reachable: braces is pulled ONLY through micromatch/fast-glob whose
#     dependents are build/lint tooling (@next/eslint-plugin-next and the
#     tailwindcss v4 DEV dependency — verified against bun.lock and
#     package.json dependency classes; zero runtime dependencies reach it, so
#     the production standalone bundle never contains it). The advisory's
#     ReDoS needs an attacker-controlled glob STRING handed to braces /
#     micromatch; this repo only ever matches repo-internal constant glob
#     patterns at build/lint time.
# (b) Real fix path: upgrade braces when upstream publishes a patched release
#     (re-run osv-scanner after every bun.lock refresh; drop this entry the
#     moment the fix lands per this file's rules).
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = "braces 3.0.3 is dev-tooling-only via micromatch/fast-glob (eslint plugin + tailwindcss devDep); no runtime reachability for the ReDoS path; no upstream fix exists yet — drop on first patched release"
