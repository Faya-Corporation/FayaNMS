# ─────────────────────────────────────────────────────────────────────────────
# FayaNMS — single-host production compose stack (T3 + T5 of
# docs/deploy/WINDOWS-SERVER-DOCKER-DESKTOP.md; Phase 21 slice 1 = PostgreSQL).
#
# Topology (T5 as landed 2026-09-13): app and worker are SEPARATE containers
# on a normal compose bridge network (service DNS names), wired by two env
# vars with loopback defaults preserved for bare-metal dev:
#   app    → WORKER_BASE_URL=http://worker:3030   (worker HTTP surface)
#   worker → NEXT_BASE_URL=http://app:3000        (Next.js persistence API)
# The worker's loopback self-calls stay container-local (SELF_BASE_URL default
# http://localhost:3030). The worker NEVER touches the database. Exactly ONE
# published port exists; 3030 and 5432 stay internal — never publish them.
#
# Persistence (Phase 21 slice 1, 2026-09-13): PostgreSQL 16 ships as the
# `postgres` service with its own named volume. The app URL is composed from
# POSTGRES_PASSWORD (REQUIRED in the --env-file — generate with
# `openssl rand -hex 32`, never commit it). The startup security policy
# rejects non-postgres DATABASE_URL values, so an app container can never
# boot against a stray SQLite file.
# ─────────────────────────────────────────────────────────────────────────────
#
# SEC-ENV-001 (2026-09-15): production secrets are SPLIT PER SERVICE. The
# --env-file .env.production is the HOST-SIDE interpolation file only (build
# args, composed DATABASE_URL, host port) — it is NOT any container's runtime
# env anymore. Each service maps to its own env file:
#   app    → .env.production.app     (session/KEK/control identity; NO vault)
#   worker → .env.production.worker  (worker identity/vault/CA pin; NO session/KEK/DB)
#   provision needs no env file (DATABASE_URL composed; demo-mode is a -e override)
# Templates: docs/deploy/env.app.production.example / env.worker.production.example.
# The startup policies warn on out-of-zone variables at boot (deprecation
# window; refuses after it) — src/lib/startup/security-policy.ts + worker
# identity-boot.ts.
#
# Build / provision / run (inside WSL2, repo root — demo-seed path, runbook T7):
#   cp docs/deploy/env.production.example .env.production             # host-side
#   cp docs/deploy/env.app.production.example .env.production.app     # app zone
#   cp docs/deploy/env.worker.production.example .env.production.worker  # worker zone
#   docker compose --env-file .env.production build
#   docker compose --env-file .env.production run --rm --no-deps -e NODE_ENV= \
#     -e FAYANMS_DEMO_MODE=true provision \
#     sh -c 'bunx prisma migrate deploy && bun prisma/seed.ts'
#   docker compose --env-file .env.production up -d
# (pristine instead of demo: same migrate deploy WITHOUT the seed run and the
# -e flags. Provisioning replays the committed migration history —
# prisma/migrations — NOT db push; slice 2, 2026-09-13.)

name: fayanms

services:
  postgres:
    # SUPPLY-001-A: digest-pinned base (immutable; bump = resolve the new
#    tag's digest from the registry, update, rebuild).
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: fayanms
      POSTGRES_DB: fayanms
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the --env-file (openssl rand -hex 32; never commit it)}"
    volumes:
      - fayanms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fayanms -d fayanms"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      args:
        # Interpolated from the --env-file (e.g. .env.production). Public origin,
        # NOT a secret; baked into the client bundle at build time (Dockerfile T1).
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in the --env-file — the real canonical origin; localhost and *.local are rejected in production}"
    image: fayanms-app:latest
    restart: unless-stopped
    # SEC-ENV-001: app-zone runtime env ONLY (session/KEK/service identity).
    # Device vault credentials resolve in the WORKER — never put FAYANMS_VAULT_*
    # here. DATABASE_URL arrives via the composed `environment` below, which
    # also overrides env_file for an external-DB override set in the --env-file.
    env_file: .env.production.app
    environment:
      NODE_ENV: production
      # Backend→worker hop (T5). Bridge DNS by default; the ${VAR:-default}
      # form lets the --env-file override it if a custom topology needs to.
      WORKER_BASE_URL: "${WORKER_BASE_URL:-http://worker:3030}"
      # PostgreSQL persistence (Phase 21 slice 1) — composed from the required
      # POSTGRES_PASSWORD; overrides only if the operator changes the topology.
      DATABASE_URL: "${DATABASE_URL:-postgresql://fayanms:${POSTGRES_PASSWORD}@postgres:5432/fayanms}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Front port only. Behind a TLS proxy (runbook D2) publish 80/443 there and
      # remove this. Move the host side via FAYANMS_HTTP_PORT if 80 is taken
      # (e.g. IIS); the INTERNAL port 3000 is a hardcoded contract — keep it.
      - "${FAYANMS_HTTP_PORT:-80}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: fayanms-worker:latest
    restart: unless-stopped
    # Own container on the compose bridge network (T5) — service DNS name
    # "worker" is how the app reaches it; "app" is how it reaches Next.js.
    # The worker NEVER touches PostgreSQL (all persistence via the app API).
    # SEC-ENV-001: worker-zone runtime env ONLY (worker identity, vault
    # entries, WebAPI CA pin). NEXTAUTH_SECRET / the KEK / POSTGRES_PASSWORD /
    # DATABASE_URL must NEVER appear here — both runtimes flag out-of-zone
    # variables at boot (SEC-ENV-001 deprecation path).
    env_file: .env.production.worker
    environment:
      # Worker→app persistence hop (T5).
      NEXT_BASE_URL: "${NEXT_BASE_URL:-http://app:3000}"
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # One-off schema/seed container (T7). Uses the Dockerfile BUILD stage (full
  # node_modules incl. the prisma CLI — the slim runtime does not carry it).
  # Waits for postgres health via depends_on; run with --no-deps ONLY for a
  # schema re-apply (migrate deploy) when postgres is already up. Not started
  # by `docker compose up`.
  provision:
    build:
      context: .
      target: build
      args:
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in the --env-file}"
    image: fayanms-provision:latest
    profiles: ["provision"]
    restart: "no"
    # SEC-ENV-001: the provision container receives NO env file — its only
    # secret is the composed DATABASE_URL below (schema/seed jobs need nothing
    # else; demo seeding is an explicit -e override of the run command, T7).
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://fayanms:${POSTGRES_PASSWORD}@postgres:5432/fayanms}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fayanms-pgdata:
