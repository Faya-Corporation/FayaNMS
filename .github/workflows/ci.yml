# FayaNMS — ACTIVE CI gate (.github/workflows/ci.yml · task R2-c · re-audit finding B0-002).
#
# ── GOVERNANCE STATUS (reconciled with LIVE GitHub state, DOC-001-A 2026-09-15) ──
# Workflow:          ACTIVE — this workflow runs ALL FOUR jobs (gate + e2e +
#                    browser + scan) on every push and pull_request.
# Branch protection: NOT ACTIVE. Live API read-back 2026-09-15:
#                    branches/main → protected:false, protection.enabled:false,
#                    required status checks enforcement_level:off, zero contexts.
#                    (The earlier "protection active" claim here was governance
#                    drift — the earlier settings-side activation did not hold.)
# Required checks:   gate + scan + e2e + browser are DESIGNED as required checks —
#                    the ruleset must be (re-)enabled by the OWNER (GOV-001,
#                    docs/audits/FayaNMS-NEXT-TASKS.md): PRs required, gate+scan+e2e+browser
#                    as required status checks, no force-push/deletion, admin bypass
#                    scoped and recorded (SOCIAL-REPOSITORY §6). Until then, direct
#                    pushes to main run these gates from the sandbox with the results
#                    recorded honestly per commit in worklog.md (R70 update: the
#                    runner-capacity block lifted 2026-09-19 — run 35414649589 was
#                    the FIRST real gate execution; CI bring-up findings are
#                    remediated in-branch and re-proven by dispatch per push).
# required-checks: gate, scan, e2e, browser
# History:           the activation path (PAT workflow-scope blocker, the corrupted
#                    `branches:` trigger, the docs/ci/ci-gate.yml pointer era,
#                    runs #1–#5 shakedown failures, first green run #6) is recorded
#                    in worklog.md and docs/brand/SOCIAL-REPOSITORY.md §6.
#
# Supply-chain hardening (re-audit R10-005, 2026-09-11): every third-party action is
# pinned to the full commit SHA its version tag resolved to on 2026-09-11 (tags are
# mutable; SHAs are not), and both downloaded binaries (osv-scanner, syft) are
# sha256-verified against upstream release checksums BEFORE execution. Update pins
# deliberately, never passively.
#
# Job structure (audit Phase-20 plan; the full unit/contract/integration/E2E suite
# remains future work — the environment policy forbids test code in this sandbox — so
# this workflow runs the ALREADY-mandated local gates on every push/PR):
#   job `gate`:
#     1. lint                          (eslint, exit code enforced)
#     2. typecheck                     (tsc --noEmit — src/ + worker
#                                     zero-error policy)
#     3. unit/contract/security tests  (bun test tests/ — Phase 19-C AUTHZ-006
#                                     suite: role matrix, authorization contract
#                                     inventory, service auth, crypto, audit chain)
#     3b. LIVE_SSH certification       (certify.ts — the real-SSH read-only
#                                     adapter end-to-end against the in-repo
#                                     IOS protocol harness; Phase 22 slice 1,
#                                     2026-09-13)
#     4. brand validation              (brand:validate, brand:validate-icons,
#                                     validate-brand-consumers)
#     5. schema validation             (prisma validate + MIGRATION HISTORY
#                                     apply on a fresh PostgreSQL + migrations≡
#                                     schema drift guard + demo-seed smoke —
#                                     PostgreSQL 16 service container; slice 1
#                                     2026-09-13, migrate history slice 2 2026-09-13)
#     6. i18n parity                   (messages/en.json ≡ messages/ar.json)
#     7. production build              (next build with ignoreBuildErrors:false)
#   job `scan` (audit Phase 20 security gates — definitions, executed in CI):
#     8. secret scanning               (gitleaks — history + working tree)
#     9. SAST                          (semgrep p/default)
#    10. dependency scan               (osv-scanner against bun.lock)
#    11. SBOM                          (syft → CycloneDX JSON artifact)
#    12. container scan                (trivy fs — ACTIVE since the Dockerfile
#                                          landed 2026-09-12, R12; first scans clean)
# Secrets: CI uses well-formed THROWAWAY hex values — the startup security policy
# validates the shape, and no real secret ever lives in this repo.

name: CI gate

on:
  push:
    branches: [main]
  pull_request:
  # R63 — manual runs: the workflow triggers on push-to-main and PRs only,
  # so the HC-6 release gate could not execute on the z_ai_v2 integration
  # branch without opening the merge PR first. workflow_dispatch lets the
  # operator run the full 4-job battery on any branch SHA from the Actions
  # tab the moment runner capacity exists (OWNER-CI-001 → HC-6).
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    # Phase 21 slice 1: production persistence is PostgreSQL — the schema/seed
    # gates run against a REAL PostgreSQL 16 service container (same major
    # version the compose stack ships). The credentials below are throwaway
    # CI-only values on an ephemeral runner.
    services:
      postgres:
        # R60: digest-pinned reusing the SUPPLY-001-A registry resolution of
        # postgres:16-alpine (same byte-strict digest as compose.yml) — CI-only
        # and ephemeral, but no longer a mutable tag-pinned base input.
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: fayanms
          POSTGRES_DB: fayanms
          POSTGRES_PASSWORD: fayanms-ci-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fayanms -d fayanms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: "postgresql://fayanms:fayanms-ci-only@localhost:5433/fayanms"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "6b1f0f4c2c5e4d9a8f3c7e2b1a5d9f8e3c7b2a6d1e9f4c8b3a7d2e6f1c5b9a03"
      FAYANMS_SERVICE_SECRET: "6b1f0f4c2c5e4d9a8f3c7e2b1a5d9f8e3c7b2a6d1e9f4c8b3a7d2e6f1c5b9a03"
      FAYANMS_CONFIG_ENC_KEY: "6b1f0f4c2c5e4d9a8f3c7e2b1a5d9f8e3c7b2a6d1e9f4c8b3a7d2e6f1c5b9a03"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned 2026-09-11)
        with:
          fetch-depth: 0 # full history — gitleaks scans origin commits too

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (SHA-pinned 2026-09-11)
        with:
          bun-version: 1.3.14 # pinned: the version this repo is developed/tested with

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Phase 22: the worker is a real service with its own runtime dependency
      # (ssh2) and its own committed lockfile. Installed frozen so the
      # certification step AND the typecheck resolve ssh2/@types/ssh2 exactly
      # like the repo does. (The worker IMAGE does its own --omit dev/optional
      # install in Dockerfile.worker — CI needs the types for the typecheck.)
      - name: Install worker dependencies (frozen)
        run: cd mini-services/worker && bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Documented policy: "src/ + worker zero-error". The repo currently
      # carries known pre-existing TypeScript errors under examples/ and
      # skills/ (legacy reference/skill directories OUTSIDE the product;
      # cleanup is tracked separately, not in this gate). Failures are never
      # hidden: tsc's full output stays visible via tee, and the grep gate
      # re-checks the log so any error under src/, scripts/ or mini-services/
      # fails the job while the known-legacy example/skill directories do not
      # block. (mini-services enforcement added in Phase 22 slice 1 — run #21
      # proved worker type errors were invisible before.)
      - name: Typecheck (tsc — src/ + worker zero-error policy)
        run: |
          bunx tsc --noEmit 2>&1 | tee tsc.log
          test ! -n "$(grep -E '^(src|scripts|mini-services)/' tsc.log)"

      # R70 (2026-09-19) — DB bootstrap BEFORE tests. The unit/contract suite
      # exercises the REAL authorization/audit planes against PostgreSQL, so the
      # committed migration history must be replayed before `bun test`. A fresh
      # CI service container has an EMPTY database: the old ordering (migrate
      # AFTER tests) only ever passed locally because the long-lived sandbox
      # database was already migrated, and the infra-blocked CI era never let a
      # real run expose the gap. Run 35414649589 (first real gate execution)
      # failed exactly there — `The table public.User does not exist` — and the
      # fix was proven on a byte-fresh replica database (fayanms_gatecheck):
      # suite 997/18/0. `migrate deploy` replays the committed history alone
      # (the T7 provisioning path) and is idempotent.
      - name: Migration history applies to a fresh PostgreSQL (service container)
        run: bunx prisma migrate deploy

      - name: Tests (role matrix, authorization contract, service auth, crypto, audit chain)
        run: bun test tests/

      # Phase 22 slice 1 — the LIVE_SSH read-only data plane (real ssh2 client
      # against a REAL in-process SSH server with an IOS persona). Proves
      # routing, transport, command mapping, normalization AND every typed
      # failure path. Self-contained (ephemeral port, throwaway secrets).
      - name: Live SSH adapter certification (Phase 22 slice 1)
        env:
          # R71 — the certification IS the loopback lab: the driver dials the
          # in-process protocol harnesses on 127.0.0.1, so the documented
          # FAYANMS_PROBE_ALLOW_SPECIAL lab hatch (R50 target-policy) must be
          # presented by the caller. Run 35414649589 — the first real gate
          # execution — failed exactly here (SSH_TARGET_POLICY_REFUSED:
          # loopback, before any credential/connection work) because the step
          # never set it and the driver had never run outside the sandbox
          # shell that exported the hatch. The R64 knobs pin the service
          # trust plane to the legacy throwaway (hermetic in-process
          # mint/verify) — belt-and-braces on a runner that can never carry
          # a dev .env; the CI-replica re-execution with exactly this env
          # PASSED (134 checks, 5 flavors, protocol level).
          FAYANMS_PROBE_ALLOW_SPECIAL: "true"
          FAYANMS_SERVICE_PRIVATE_KEY: ""
          FAYANMS_SERVICE_PUBLIC_KEYS: ""
          FAYANMS_SERVICE_ENV_FILE: ""
        run: bun mini-services/worker/certify.ts

      # Phase B3 / re-audit BR-C2 — brand/icon governance gates (see
      # docs/brand/ASSET-MANIFEST.md §5 for the validation contract).
      - name: Brand asset validation
        run: bun run brand:validate

      - name: Icon registry validation
        run: bun run brand:validate-icons

      - name: Brand consumer validation
        run: bun scripts/validate-brand-consumers.ts

      - name: Prisma schema validation
        run: bunx prisma validate

      # Phase 21 slice 2 (2026-09-13): provisioning goes through the COMMITTED
      # migration history (prisma/migrations), not db push. R70 moved the
      # migrate-deploy step ABOVE "Tests" (fresh-CI-container bootstrap — run
      # 35414649589); the fresh-database provisioning proof itself now lives in
      # the e2e/browser harness (creates/migrates its own fayanms_e2e database)
      # and in the drift guard below.

      # Drift guard: the committed history must reproduce prisma/schema.prisma
      # EXACTLY. `migrate diff --exit-code` exits 2 on any difference (0 on
      # parity), so editing the schema without landing a migration fails the
      # gate. The shadow database is a throwaway on the same ephemeral service
      # container; Bun's built-in PostgreSQL client creates it (no psql
      # dependency on the runner).
      - name: Create shadow database (drift-guard target)
        run: bun -e '
          import { SQL } from "bun";
          const sql = new SQL("postgresql://fayanms:fayanms-ci-only@localhost:5433/fayanms");
          await sql.unsafe(`DROP DATABASE IF EXISTS "fayanms_shadow"`);
          await sql.unsafe(`CREATE DATABASE "fayanms_shadow"`);
          console.log("shadow database ready");
          await sql.end();
          '

      - name: Migrations ≡ schema (drift guard)
        run: bunx prisma migrate diff --from-migrations prisma/migrations --shadow-database-url postgresql://fayanms:fayanms-ci-only@localhost:5433/fayanms_shadow --to-schema-datamodel prisma/schema.prisma --exit-code

      # T7 provisioning path proven on every push (now migrate deploy + seed):
      # the demo seed is idempotent, refuses production NODE_ENV (unset here),
      # and requires the demo gate — set at STEP level so no other step (in
      # particular the production build) ever sees FAYANMS_DEMO_MODE=true.
      - name: Demo seed smoke (T7 provisioning path on PostgreSQL)
        env:
          FAYANMS_DEMO_MODE: "true"
        run: bun prisma/seed.ts

      - name: i18n parity (EN ≡ AR)
        run: |
          bun -e '
          const collect = (obj, prefix = "") => {
            const keys = new Set();
            for (const [k, v] of Object.entries(obj)) {
              const key = prefix ? prefix + "." + k : k;
              if (v && typeof v === "object" && !Array.isArray(v)) {
                for (const child of collect(v, key)) keys.add(child);
              } else {
                keys.add(key);
              }
            }
            return keys;
          };
          const en = collect(JSON.parse(await Bun.file("messages/en.json").text()));
          const ar = collect(JSON.parse(await Bun.file("messages/ar.json").text()));
          const onlyEn = [...en].filter((k) => !ar.has(k));
          const onlyAr = [...ar].filter((k) => !en.has(k));
          if (onlyEn.length || onlyAr.length) {
            console.error("i18n parity FAIL", { en: en.size, ar: ar.size, onlyEn, onlyAr });
            process.exit(1);
          }
          console.log("i18n parity OK:", en.size, "EN keys ==", ar.size, "AR keys");
          '

      # Build gate only. siteUrl() (src/lib/brand/identity.ts, re-audit B3-029)
      # throws in production without NEXT_PUBLIC_SITE_URL and rejects localhost
      # in production (allowed only in dev/test), so the committed `build:gate`
      # script (package.json — the SAME command as the local verification gate)
      # supplies the reserved .invalid build-only placeholder. Real production
      # deploys MUST set NEXT_PUBLIC_SITE_URL to the real public https origin.
      - name: Production build (typecheck-bypassing is disabled)
        run: bun run build:gate

  # TEST-001-A (independent audit 2026-09-15): release-critical E2E journeys
  # against the REAL topology — production app server (standalone build) +
  # poll-based worker + PostgreSQL + simulator plane. NO mocks: the journeys
  # drive NextAuth sign-in (CSRF dance), inventory CRUD, the full change
  # lifecycle (submit → bindable approvals → worker-driven execute →
  # terminal states, success AND truthful failure), the API-client bearer
  # plane (create/scope/revoke), and the login abuse guard (burst → 429 →
  # recovery). Fresh random secrets per run: the deterministic CI fixture
  # values are REFUSED by the production startup policy (P1-019) — exactly
  # as designed.
  e2e:
    runs-on: ubuntu-latest
    needs: gate
    continue-on-error: false # release-critical journeys are a hard gate
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: fayanms
          POSTGRES_DB: fayanms
          POSTGRES_PASSWORD: fayanms-ci-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fayanms -d fayanms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: "postgresql://fayanms:fayanms-ci-only@localhost:5433/fayanms"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned 2026-09-11)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (SHA-pinned 2026-09-11)
        with:
          bun-version: 1.3.14

      - name: Install dependencies (app + worker, frozen)
        run: |
          bun install --frozen-lockfile
          cd mini-services/worker && bun install --frozen-lockfile

      - name: Production build (standalone output, journeys' boot entry)
        run: bun run build:gate

      # The harness creates/migrates/seeds its OWN fayanms_e2e database and
      # tears it down; the parent fayanms database is only the clone source.
      - name: Run release-critical E2E journeys (app + worker + PG, no mocks)
        run: FAYANMS_E2E=1 bun test tests/e2e/

  # TASK-BROWSER-E2E — the RENDERING layer: real headless-Chromium journeys
  # (sign-in → app shell → sign-out), axe-core a11y scans (sign-in +
  # authenticated dashboard), a keyboard-only sweep and an RTL (ar) sweep —
  # against the SAME real topology as the e2e job (shared harness). Runs the
  # suite with FAYANMS_BROWSER_E2E=1 so the hermetic unit gate stays
  # browser-free. (R70: the CI-001 runner block lifted 2026-09-19; all four
  # jobs now execute on dispatch and their bring-up is tracked per run.)
  browser:
    runs-on: ubuntu-latest
    needs: gate
    continue-on-error: false # rendering-layer evidence is a hard gate
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: fayanms
          POSTGRES_DB: fayanms
          POSTGRES_PASSWORD: fayanms-ci-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fayanms -d fayanms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: "postgresql://fayanms:fayanms-ci-only@localhost:5433/fayanms"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned 2026-09-11)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (SHA-pinned 2026-09-11)
        with:
          bun-version: 1.3.14

      - name: Install dependencies (app + worker, frozen)
        run: |
          bun install --frozen-lockfile
          cd mini-services/worker && bun install --frozen-lockfile

      - name: Install headless Chromium (playwright-managed browser)
        run: bunx playwright install --with-deps chromium

      - name: Production build (standalone output, journeys' boot entry)
        run: bun run build:gate

      - name: Run rendering-layer browser journeys (axe a11y + keyboard + RTL)
        run: FAYANMS_BROWSER_E2E=1 bun test tests/browser/

  scan:
    runs-on: ubuntu-latest
    needs: gate
    continue-on-error: false # explicit: scan steps are a hard gate, not advisory
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned 2026-09-11)
        with:
          fetch-depth: 0

      # ── 8. P20-010 — secret scanning ──
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2 (SHA-pinned 2026-09-11)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 9. P20-011 — SAST ──
      # Action path preserved verbatim from docs/ci/ci-gate.yml; the same v1
      # action also exists under the current org name semgrep/semgrep-action@v1.
      - name: SAST (semgrep)
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1 (SHA-pinned 2026-09-11)
        with:
          config: p/default
          # Gate policy: any ERROR finding fails the build. Audit findings are
          # triaged before enabling; this is the audit's required SAST gate.

      # ── 10. P20-012 — dependency scan ──
      # History: the upstream raw install.sh (main branch) 404'd in run 34532398506,
      # so the release binary is downloaded directly (R8). R10-005 hardening: the
      # binary is sha256-verified against the upstream v2.5.1 SHA256SUMS value
      # BEFORE it is made executable and run.
      - name: Dependency scan (osv-scanner)
        run: |
          curl -sSfL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          # Root app lockfile AND the worker service lockfile (Phase 22: the
          # worker carries the ssh2 runtime dependency — its lockfile is
          # committed and scanned with the same severity).
          osv-scanner scan --lockfile=./bun.lock --lockfile=./mini-services/worker/bun.lock

      # ── 11. P20-014 — SBOM ──
      # R10-005 hardening: the unpinned `curl main/install.sh | sh` path inside a
      # security gate is GONE. syft is a pinned release tarball, sha256-verified
      # against the upstream v1.51.1 checksums file before extraction/install.
      - name: SBOM (syft → CycloneDX)
        run: |
          curl -sSfL -o /tmp/syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
          echo "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3  /tmp/syft.tar.gz" | sha256sum -c -
          mkdir -p /tmp/syft-extract
          tar -xzf /tmp/syft.tar.gz -C /tmp/syft-extract
          install -m 0755 /tmp/syft-extract/syft /usr/local/bin/syft
          syft dir:. -o cyclonedx-json > sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SHA-pinned 2026-09-11)
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      # ── 12. P20-013 — container scan (ACTIVE: Dockerfile landed 2026-09-12) ──
      # The auto-skip era ended with the R12 containerization push (runbook T1–T3
      # of docs/deploy/WINDOWS-SERVER-DOCKER-DESKTOP.md). First verified scans:
      # 0 HIGH/CRITICAL vulnerabilities (bun.lock), 0 misconfigurations (both
      # Dockerfiles), 0 secrets. The planned .trivyignore mirror never had to
      # land — the next-auth 4.24.15 patch release fixed the four triaged
      # advisories instead, and the osv-scanner.toml entries were dropped per
      # that ledger's own rules (retirement note of 2026-09-12). The hashFiles
      # guard below remains as a correctness guard for exotic checkouts.
      - name: Container scan (trivy)
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA-pinned 2026-09-11)
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Container scan skipped (guard — no Dockerfile in checkout)
        if: ${{ hashFiles('Dockerfile') == '' }}
        run: echo "Guard branch — no Dockerfile present in this checkout, so the trivy gate is skipped by definition (the Dockerfile landed 2026-09-12; this branch only fires for exotic or partial checkouts)."

      # ── 13. SUPPLY-001-A — runtime IMAGE build + image-level scan + SBOM ──
      # Filesystem scanning (above) is necessary but not sufficient: the
      # audited artifact is the image a host actually runs. Both runtime
      # images are BUILT here from the digest-pinned bases and scanned AS
      # IMAGES (OS packages inside the bases included), with per-image SBOMs
      # retained as artifacts. Base images are digest-pinned in the
      # Dockerfiles/compose files (immutable inputs; bump procedure inline).
      - name: Build runtime images (app + worker)
        run: |
          docker build -t fayanms-app:ci .
          docker build -f Dockerfile.worker -t fayanms-worker:ci .

      - name: Image scan — app (trivy, HIGH/CRITICAL fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA-pinned 2026-09-11)
        with:
          scan-type: image
          image-ref: fayanms-app:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Image scan — worker (trivy, HIGH/CRITICAL fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA-pinned 2026-09-11)
        with:
          scan-type: image
          image-ref: fayanms-worker:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Image SBOMs (syft → CycloneDX, per image)
        run: |
          syft fayanms-app:ci -o cyclonedx-json > sbom-app-image.cdx.json
          syft fayanms-worker:ci -o cyclonedx-json > sbom-worker-image.cdx.json

      - name: Upload image SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SHA-pinned 2026-09-11)
        with:
          name: sbom-runtime-images
          path: |
            sbom-app-image.cdx.json
            sbom-worker-image.cdx.json
