name: Deploy exact certified SHA to OCI staging

on:
  workflow_run:
    workflows: ["Container certification and publication"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Promote immutable image to staging
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment:
      name: staging
    timeout-minutes: 20
    steps:
      - name: Resolve exact source SHA
        id: source
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          sha="${MANUAL_SHA:-${EVENT_SHA}}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Validate protected deployment inputs
        env:
          HOST: ${{ secrets.OCI_STAGING_HOST }}
          USER: ${{ secrets.OCI_STAGING_USER }}
          KEY: ${{ secrets.OCI_STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$USER"
          test -n "$KEY"
          test -n "$KNOWN_HOSTS"

      # FNM-2026-108 (2026-10-18 re-audit, Wave R3): a manual workflow_dispatch
      # may name ANY 40-hex SHA — before promoting it, verify its PROVENANCE:
      # a successful "Container certification and publication" run must exist
      # for that exact SHA, from a protected main push (event=push,
      # head_branch=main). Automatic workflow_run promotions already carry
      # this property by construction and skip this check.
      - name: Verify certification provenance for manual promotions
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          run_id="$(curl -sfS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
            | jq -r '[.workflow_runs[] \
                | select(.name == "Container certification and publication" \
                     and .event == "push" \
                     and .head_branch == "main" \
                     and .conclusion == "success")] \
              | sort_by(.run_started_at) | last | .id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main-push container certification exists for $SHA — refusing manual promotion (FNM-2026-108)" >&2
            exit 1
          fi
          echo "Provenance OK: certification run $run_id for $SHA"

      - name: Deploy exact SHA over restricted SSH
        env:
          HOST: ${{ secrets.OCI_STAGING_HOST }}
          USER: ${{ secrets.OCI_STAGING_USER }}
          KEY: ${{ secrets.OCI_STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_STAGING_KNOWN_HOSTS }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KEY" >"$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" "$USER@$HOST" \
            "cd /opt/fayanms && sudo ./deploy.sh '$SHA'"

      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
