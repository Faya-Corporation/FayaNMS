name: Container certification and publication

on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.worker
      - Dockerfile.migrator
      - compose*.yml
      - .dockerignore
      - .github/workflows/container.yml
      - scripts/ci/arm64-runtime-smoke.sh
      - package.json
      - bun.lock
      - prisma/**
      - src/**
      - app/**
      - mini-services/worker/**
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["CI gate"]
    types: [completed]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64:
    name: ARM64 build and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout — the arm64 job holds ONLY `contents: read` and NO secrets; it builds and scans images locally and never pushes. Checking out the workflow_run head is exposure-equivalent to this same workflow's own pull_request trigger (untrusted PR code is already built locally there). It would become unsafe ONLY if a secret or push capability were added to this job without first pinning the ref to a trusted commit.
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned 2026-10-04)
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ARM64 application image
        run: |
          docker buildx build             --platform linux/arm64             --load             --tag fayanms:arm64-${CANDIDATE_SHA}             --build-arg FAYANMS_SOURCE_SHA=${CANDIDATE_SHA}             --label org.opencontainers.image.revision=${CANDIDATE_SHA}             --label org.opencontainers.image.source=https://github.com/Faya-Corporation/FayaNMS             --provenance=false             .

      - name: Build ARM64 worker image
        run: |
          docker buildx build --platform linux/arm64 --load --file Dockerfile.worker --tag fayanms-worker:arm64-${CANDIDATE_SHA} --build-arg FAYANMS_SOURCE_SHA=${CANDIDATE_SHA} .
          docker run --rm fayanms-worker:arm64-${CANDIDATE_SHA} --version

      - name: Build ARM64 migration image
        run: |
          docker buildx build --platform linux/arm64 --load --file Dockerfile.migrator --tag fayanms-migrator:arm64-${CANDIDATE_SHA} --build-arg FAYANMS_SOURCE_SHA=${CANDIDATE_SHA} .
          docker run --rm fayanms-migrator:arm64-${CANDIDATE_SHA} run ./node_modules/prisma/build/index.js --version

      - name: Verify image architecture and runtime
        run: |
          test "$(docker image inspect fayanms:arm64-${CANDIDATE_SHA} --format '{{.Architecture}}')" = "arm64"
          docker run --rm fayanms:arm64-${CANDIDATE_SHA} --version
          IMAGE=fayanms:arm64-${CANDIDATE_SHA} bash scripts/ci/arm64-runtime-smoke.sh
          test "$(docker image inspect fayanms-worker:arm64-${CANDIDATE_SHA} --format '{{.Architecture}}')" = "arm64"
          test "$(docker image inspect fayanms-migrator:arm64-${CANDIDATE_SHA} --format '{{.Architecture}}')" = "arm64"

      - name: Scan ARM64 image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: fayanms:arm64-${{ github.event.workflow_run.head_sha || github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan ARM64 worker image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: fayanms-worker:arm64-${{ github.event.workflow_run.head_sha || github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan ARM64 migration image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: fayanms-migrator:arm64-${{ github.event.workflow_run.head_sha || github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

  publish:
    name: Publish immutable GHCR image
    needs: arm64
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout — the publish job's `if:` gate admits ONLY workflow_run events where the triggering run was event == 'push' to head_branch == 'main' AND concluded 'success'; head_sha is therefore a branch-protected main commit already validated by the CI gate, never a fork/PR head. It would become a pwn-request risk ONLY if the if-gate were widened (e.g. to pull_request events or other head_branches).
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned 2026-10-04)
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/faya-corporation/fayanms
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Faya-Corporation/FayaNMS
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Extract worker OCI metadata
        id: worker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/faya-corporation/fayanms-worker
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Faya-Corporation/FayaNMS
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Extract migration OCI metadata
        id: migrator-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/faya-corporation/fayanms-migrator
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Faya-Corporation/FayaNMS
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      # RT-017 / F-024 — scan BEFORE any publication. The three gate steps
      # below build the images LOCALLY (push: false, load: true) and the
      # trivy gate scans those LOCAL refs; only after all three gates pass
      # do the multi-arch push steps run, so every published image has
      # already passed the HIGH/CRITICAL gate.
      # Multi-arch note: buildx cannot `load` a multi-platform manifest, so
      # the gate runs on the locally built linux/amd64 image — the
      # vulnerability surface is effectively identical across arches for
      # these images (same Dockerfiles, same digest-pinned bases), the
      # dedicated arm64 job additionally builds and scans linux/arm64
      # locally, and the arm64 attestation still ships via the later
      # multi-arch push (buildx cache makes the second build cheap).
      - name: Build gate image (local, never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: fayanms:gate
          build-args: |
            FAYANMS_SOURCE_SHA=${{ github.event.workflow_run.head_sha }}

      - name: Build gate worker image (local, never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: false
          load: true
          tags: fayanms-worker:gate
          build-args: |
            FAYANMS_SOURCE_SHA=${{ github.event.workflow_run.head_sha }}

      - name: Build gate migration image (local, never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.migrator
          platforms: linux/amd64
          push: false
          load: true
          tags: fayanms-migrator:gate
          build-args: |
            FAYANMS_SOURCE_SHA=${{ github.event.workflow_run.head_sha }}

      # Gate contract mirrors ci.yml's image scans and R78-B policy:
      # fatal for every HIGH/CRITICAL result, including unfixed findings —
      # evaluated on the LOCALLY BUILT image, BEFORE any push (RT-017:
      # published images have always passed the gate).
      # (trivy-action's sarif mode ignores the severity filter — running the
      # gate in sarif format made ANY low-severity base-image finding fatal,
      # which is stricter than the R78 policy the repo actually enforces.)
      - name: Scan built image (HIGH/CRITICAL fatal)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: fayanms:gate
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan built worker image (HIGH/CRITICAL fatal)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: fayanms-worker:gate
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan built migration image (HIGH/CRITICAL fatal)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: fayanms-migrator:gate
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

      # Reached only after all three gates above passed on the local image.
      - name: Build and push immutable multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FAYANMS_SOURCE_SHA=${{ github.event.workflow_run.head_sha }}
          sbom: true
          provenance: mode=max

      - name: Build and push immutable worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          build-args: |
            FAYANMS_SOURCE_SHA=${{ github.event.workflow_run.head_sha }}
          sbom: true
          provenance: mode=max

      - name: Build and push immutable migration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.migrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.migrator-meta.outputs.tags }}
          labels: ${{ steps.migrator-meta.outputs.labels }}
          build-args: |
            FAYANMS_SOURCE_SHA=${{ github.event.workflow_run.head_sha }}
          sbom: true
          provenance: mode=max

      # Structured evidence for the release-evidence manifest: SARIF with all
      # severities, NON-blocking (exit 0), captured even when the gate above
      # trips so triage always has machine-readable findings.
      - name: Capture published-image scan evidence (SARIF, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/faya-corporation/fayanms:${{ github.event.workflow_run.head_sha }}
          format: sarif
          output: trivy-ghcr.sarif
          exit-code: "0"

      - name: Upload image scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (SHA-pinned 2026-10-04)
        with:
          name: ghcr-trivy-${{ github.sha }}
          path: trivy-ghcr.sarif
          if-no-files-found: ignore
          retention-days: 14
