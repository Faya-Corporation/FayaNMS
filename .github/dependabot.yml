# Dependabot — HC-5 (R57): supply-chain automation config.
#
# Why: pin discipline was previously manual + the CI osv gate only (re-audit
# 2026-09-18 INFO note, codified as roadmap HC-5). This file automates the
# weekly intended-diff for BOTH bun manifests in the repo — the two projects
# behind the dual-lockfile osv scan in ci.yml:
#
#   1. the root app  —  /package.json            + /bun.lock
#   2. the worker    —  mini-services/worker/…   + mini-services/worker/bun.lock
#
# …and (RT-035, F-065) the github-actions ecosystem for the CI workflows
# themselves: every third-party action in ci.yml is SHA-pinned, so pin
# updates are what keeps those SHAs from rotting silently. Non-security
# bumps land individually; security updates are grouped (same policy as the
# bun entries). NOTE (comment only, no workflow change here):
# returntocorp/semgrep-action is ARCHIVED upstream — migration to the
# semgrep/semgrep CLI (like the other pinned binaries) is a separate
# follow-up (BACKLOG under A5-13); its bump PRs are the pin-freshness
# mechanism until then.
#
# Policy (the "known versioning policy", enforced by construction):
#   - Dependabot PRESERVES each dependency's declared range style when it
#     bumps: a caret dep (the 61-entry default) gets a caret bump; an exact
#     pin (next, react, and every other unprefixed version) is bumped IN
#     PLACE as a new exact pin and is never widened. The allow list below
#     (dependency-type: all) declares what is auto-updatable so the exact-
#     pin discipline stays intact — updates never loosen a constraint.
#   - Security updates are GROUPED per manifest (applies-to:
#     security-updates) so several CVE bumps land as one reviewable PR
#     instead of N dangling branches.
#   - Cadence: weekly, Monday. Regular (non-security) version updates come
#     as individual PRs capped by open-pull-requests-limit.
#
# ACTIVATION CAVEAT (OWNER-CI-001): this config is merged and reviewable
# now, but Dependabot PRs only appear once the repo has Actions/runner
# capacity for GitHub to run the scheduled update jobs. Until then the
# weekly intended-diff is reviewable manually from this file + osv gate.
# Validity of the ecosystem keys is GitHub-side; YAML shape is pinned by
# tests/audit/r57-dependabot-config.test.ts and was parsed locally at R57.

version: 2

updates:
  # ── Manifest 1/2: root app (package.json + bun.lock) ──────────────────
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    # W3-D (semgrep dependabot-missing-cooldown): rate-limit how fresh a
    # release must be before Dependabot proposes it — newly published
    # versions get a 7-day soak before Dependabot proposes them (the value
    # the rule pins as the floor; it dampens supply-chain churn without
    # muting security updates).
    cooldown:
      default-days: 7
    # Allow list — the versioning policy: everything is auto-updatable, but
    # bumps preserve the declared range style (exact pins stay exact pins).
    allow:
      - dependency-type: "all"
    # Grouped security updates: one reviewable PR per security wave.
    groups:
      security-updates:
        applies-to: security-updates
        dependency-type: "production"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"

  # ── Manifest 2/2: worker mini-service (its own package.json + lockfile) ─
  - package-ecosystem: "bun"
    directory: "/mini-services/worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    # W3-D: same 7-day cooldown policy as the root-app entry (see above).
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "all"
    groups:
      security-updates:
        applies-to: security-updates
        dependency-type: "production"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"

  # ── Ecosystem 3/3: the CI workflows themselves (RT-035, F-065) ─────────
  # Keeps the SHA pins of third-party actions fresh (the actions are pinned
  # by policy; without this entry nothing ever proposed a pin update).
  # Same house policy as the bun entries: non-security bumps individually,
  # security updates grouped.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    # W3-D: same 7-day cooldown policy as the bun entries (see above).
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "all"
    groups:
      security-updates:
        applies-to: security-updates
        dependency-type: "production"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
