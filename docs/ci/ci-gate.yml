# CI gate — moved to `.github/workflows/ci.yml`

This file is **no longer the CI definition**. The active workflow now lives at:

```text
.github/workflows/ci.yml
```

(created by task R2-c, re-audit finding B0-002). A workflow only runs from
`.github/workflows/`; the definition previously stored here was a
ready-to-push copy, never an active gate.

## History note

- The definition that used to live here had a corrupted trigger line —
  `branches: ain]` instead of `branches: [main]` — recorded during task R1
  (worklog R1-orch), which would have failed YAML parsing. The corrected
  `branches: [main]` trigger is carried into `.github/workflows/ci.yml`.
- The old copy also ran bare `bunx tsc --noEmit`; the active workflow instead
  implements the documented **src/ zero-error policy** (full `tsc` output is
  kept visible, and any error under `src/` or `scripts/` fails the job, while
  the known pre-existing legacy errors under `examples/` and `skills/` do not
  block — that cleanup is tracked separately).

## Activation status (still not CI-enforced — B0-002)

Activation requires **both**:

1. **Push of `.github/workflows/ci.yml` with a token that carries the
   `workflow` scope.** Historical blocker: the current repository PAT lacks
   that scope — P19-10 and Phase 19-C both hit the same remote rejection; the
   earlier ready-to-push commit is preserved on the local branch
   `local/ci-workflow-activation`.
2. **Branch protection + required status checks (`gate`, `e2e`, `browser`,
   `scan` — all FOUR jobs) in GitHub settings** (PR required + 1 approval + CODEOWNERS review + conversation
   resolution, no force push/delete). These are settings-side actions, tracked
   in [docs/brand/SOCIAL-REPOSITORY.md](../brand/SOCIAL-REPOSITORY.md) and the
   release checklist.

Until a real pushed commit has a green **required** check, brand validation is
a developer convention, not a non-bypassable repository control — do not
describe it as CI-enforced.

