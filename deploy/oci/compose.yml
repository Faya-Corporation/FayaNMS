name: fayanms-staging

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: fayanms
      POSTGRES_DB: fayanms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in /opt/fayanms/.env}
    volumes:
      - fayanms-pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fayanms -d fayanms"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  migrate:
    image: ${FAYANMS_MIGRATOR_IMAGE:?FAYANMS_MIGRATOR_IMAGE must be an immutable GHCR reference}
    profiles: ["provision"]
    restart: "no"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in /opt/fayanms/.env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    command: ["run", "./node_modules/prisma/build/index.js", "migrate", "deploy"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 512m

  app:
    image: ${FAYANMS_IMAGE:?FAYANMS_IMAGE must be an immutable GHCR reference}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in /opt/fayanms/.env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL must be set in /opt/fayanms/.env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL must be set in /opt/fayanms/.env}
      WORKER_BASE_URL: http://worker:3030
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - backend
      - edge
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  worker:
    image: ${FAYANMS_WORKER_IMAGE:?FAYANMS_WORKER_IMAGE must be an immutable GHCR reference}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_BASE_URL: http://app:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - lab
    expose:
      - "3030"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3030/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    env_file: .env
    environment:
      FAYANMS_TLS_DOMAIN: ${FAYANMS_TLS_DOMAIN:?FAYANMS_TLS_DOMAIN must be set in /opt/fayanms/.env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FAYANMS_HTTP_PORT:-80}:80"
      - "${FAYANMS_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  fayanms-pgdata:
  caddy-data:
  caddy-config:

networks:
  backend:
    internal: true
  edge: {}
  lab:
    internal: true
