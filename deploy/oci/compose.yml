name: fayanms-staging

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    # SEC-ENV-001 (RT-006): no env_file here — postgres gets ONLY the three
    # POSTGRES_* keys below, interpolated from the host-side --env-file (.env).
    environment:
      POSTGRES_USER: fayanms
      POSTGRES_DB: fayanms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in /opt/fayanms/.env}
    # GA-6 (P0-R03, 2026-10-06 re-audit): WAL archiving — the PITR
    # foundation the DR runbook documents (docs/runbooks/disaster-recovery.md
    # §Point-in-time recovery). Archive files land in the fayanms-wal volume;
    # the wal-init one-shot (provision profile) pre-creates the directory
    # with postgres-image ownership so archive_command can write from the
    # very first WAL segment. restore_command and recovery_target_time
    # templates live in the runbook — they are applied by hand on the
    # disposable PITR target, never here.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
    volumes:
      - fayanms-pgdata:/var/lib/postgresql/data
      - fayanms-wal:/wal-archive
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fayanms -d fayanms"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  migrate:
    image: ${FAYANMS_MIGRATOR_IMAGE:?FAYANMS_MIGRATOR_IMAGE must be an immutable GHCR reference}
    profiles: ["provision"]
    restart: "no"
    # SEC-ENV-001 (RT-006): no env_file — the one-off migrator receives only
    # NODE_ENV and the interpolated DATABASE_URL below.
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in /opt/fayanms/.env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    command: ["run", "./node_modules/prisma/build/index.js", "migrate", "deploy"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 512m

  # GA-6 (P0-R03): one-shot WAL-archive directory preparation. Runs ONLY in
  # the provision profile (`docker compose --profile provision up wal-init`)
  # BEFORE the postgres service first starts with archive_mode on — a fresh
  # named volume is root-owned and the postgres process (uid 70 in the
  # alpine image) could not write archive segments into it. Idempotent.
  wal-init:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    profiles: ["provision"]
    restart: "no"
    user: root
    volumes:
      - fayanms-wal:/wal-archive
    command: ["sh", "-c", "mkdir -p /wal-archive && chown 70:70 /wal-archive && chmod 700 /wal-archive"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m

  backup:
    image: ${FAYANMS_BACKUP_IMAGE:?FAYANMS_BACKUP_IMAGE must be an immutable GHCR reference (build deploy/oci/backup-sidecar)}
    restart: unless-stopped
    # GA-6 (P0-R03): SCHEDULED encrypted backups as a first-class service —
    # the host-cron path (backup.sh) remains valid; this sidecar removes the
    # "scheduled execution" external blocker for hosts that run compose
    # without host cron. The entrypoint refuses to run without an age
    # recipient (fail-closed, same contract as backup.sh: never plaintext).
    # Secrets come ONLY from the host-side --env-file interpolation below —
    # no env_file (SEC-ENV-001 / RT-006 house rule).
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in /opt/fayanms/.env}
      FAYANMS_BACKUP_AGE_RECIPIENT: ${FAYANMS_BACKUP_AGE_RECIPIENT:?FAYANMS_BACKUP_AGE_RECIPIENT must be set — refuse-plaintext is non-negotiable}
      FAYANMS_BACKUP_INTERVAL_SECONDS: ${FAYANMS_BACKUP_INTERVAL_SECONDS:-21600}
      FAYANMS_BACKUP_RETENTION_DAYS: ${FAYANMS_BACKUP_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - fayanms-backups:/backups
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  app:
    image: ${FAYANMS_IMAGE:?FAYANMS_IMAGE must be an immutable GHCR reference}
    restart: unless-stopped
    # SEC-ENV-001 (RT-006): the app is the ONLY container that receives the
    # app-zone secret file (session secret, config-encryption KEK, CONTROL
    # keypair). Everything below is interpolated from the host-side .env.
    env_file:
      - .env.app
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in /opt/fayanms/.env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL must be set in /opt/fayanms/.env}
      # F-026: RUNTIME origin — takes effect WITHOUT a rebuild (the site URL is
      # resolved per request by src/lib/brand/site-url.ts from the server env).
      SITE_URL: ${SITE_URL:?SITE_URL must be set in /opt/fayanms/.env}
      WORKER_BASE_URL: http://worker:3030
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - backend
      - edge
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/api/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  worker:
    image: ${FAYANMS_WORKER_IMAGE:?FAYANMS_WORKER_IMAGE must be an immutable GHCR reference}
    restart: unless-stopped
    # SEC-ENV-001 (RT-006): worker-zone file only — WORKER keypair, vault
    # credentials, CA pin. NEVER the monolithic .env (no KEK/session/DB there).
    env_file:
      - .env.worker
    environment:
      NODE_ENV: production
      NEXT_BASE_URL: http://app:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - lab
    expose:
      - "3030"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3030/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    # SEC-ENV-001 (RT-006): no env_file — caddy receives ONLY the TLS domain
    # below (interpolated from the host-side .env). Zero secrets reach the
    # edge proxy.
    environment:
      FAYANMS_TLS_DOMAIN: ${FAYANMS_TLS_DOMAIN:?FAYANMS_TLS_DOMAIN must be set in /opt/fayanms/.env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FAYANMS_HTTP_PORT:-80}:80"
      - "${FAYANMS_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  fayanms-pgdata:
  fayanms-wal:
  fayanms-backups:
  caddy-data:
  caddy-config:

networks:
  backend:
    internal: true
  edge: {}
  lab:
    internal: true
