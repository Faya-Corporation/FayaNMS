# These monitoring images are digest-pinned to reviewed release references.
# The monitoring profile remains operator-enabled only: validate the selected
# platform manifest, scan the exact digests, and complete staging burn-in before
# enabling it in OCI.
name: fayanms-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
      - monitoring
    expose:
      - "9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # RT-036 (F-066): --web.enable-lifecycle REMOVED — it exposed the
      # unauthenticated lifecycle admin endpoints (reload/quit) to the
      # backend/monitoring networks. Config reloads = container restart
      # (`docker compose restart prometheus`); the TSDB persists in the
      # prometheus-data named volume, and at this scale restart is
      # sufficient (no auth infrastructure exists on that network, so
      # basic-auth-gated lifecycle was not an option).
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 128
    mem_limit: 512m

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.136.0@sha256:45392d534c1edcc809c2d112394029246bc679d2ae5ea7081414a1fc74f2c621
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - backend
      - monitoring
    expose:
      - "4317"
      - "4318"
      - "9464"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 128
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    profiles: ["monitoring"]
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD only on the host}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m

volumes:
  prometheus-data:
  grafana-data:

networks:
  backend:
    external: true
    name: fayanms-staging_backend
  monitoring:
    internal: true
