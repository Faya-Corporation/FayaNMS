# These monitoring images are tag-pinned pending an operator-approved digest
# resolution from the selected registry. Do not enable the profile in a
# production environment until the three tags are replaced with reviewed
# immutable digests and scanned.
name: fayanms-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
      - monitoring
    expose:
      - "9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 128
    mem_limit: 512m

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ../../monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - backend
      - monitoring
    expose:
      - "4317"
      - "4318"
      - "9464"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 128
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["monitoring"]
    restart: unless-stopped
    env_file: ../oci/.env
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD only on the host}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m

volumes:
  prometheus-data:
  grafana-data:

networks:
  backend:
    external: true
    name: fayanms-staging_backend
  monitoring:
    internal: true
